[package]
name = "finter"
version = "0.1.4"
edition = "2024"

[dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
rust-embed = { version = "6.8.1", features = ["include-exclude"] }
anyhow = "1.0"
log = "0.4.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
self-replace = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
tokio-util = "0.7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
keyring = { version = "3", features = ["linux-native", "apple-native", "windows-native"] }
dirs = "5"
rust-i18n = "3"
smallvec = "1"
itertools = "0.13"
tiny_http = "0.12"
webbrowser = "1.0"
url = "2"
urlencoding = "2.1"
sha2 = "0.10"
uuid = { version = "1.26.1", features = ["v4"] }
rodio = { version = "0.19", default-features = false, features = ["wav"] }

[patch.crates-io]
gpui = { path = "gpui-patched" }
gpui-component = { path = "gpui-component-patched" }

[build-dependencies]
winres = "0.1.12"

