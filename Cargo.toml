[package]
name = "finter"
version = "0.1.8"
edition = "2024"

[features]
# CCXT compiles one generated implementation per venue. Keep the default build
# to the major spot/futures venues; enable extra venues explicitly, e.g.
#   cargo build --features exchange-kraken,exchange-coinbaseexchange
default = [
    "exchange-binance",
    "exchange-binanceusdm",
    "exchange-binancecoinm",
    "exchange-bybit",
    "exchange-okx",
    "exchange-kucoin",
    "exchange-kucoinfutures",
]
# Smallest useful build: Binance spot + USDⓈ-M + COIN-M.
minimal = [
    "exchange-binance",
    "exchange-binanceusdm",
    "exchange-binancecoinm",
]
exchange-binance = ["ccxt/binance"]
exchange-binanceusdm = ["ccxt/binanceusdm"]
exchange-binancecoinm = ["ccxt/binancecoinm"]
exchange-bybit = ["ccxt/bybit"]
exchange-okx = ["ccxt/okx"]
exchange-kucoin = ["ccxt/kucoin"]
exchange-kucoinfutures = ["ccxt/kucoinfutures"]
exchange-kraken = ["ccxt/kraken"]
exchange-krakenfutures = ["ccxt/krakenfutures"]
exchange-coinbaseexchange = ["ccxt/coinbaseexchange"]
exchange-mexc = ["ccxt/mexc"]
exchange-htx = ["ccxt/htx"]
exchange-bitfinex = ["ccxt/bitfinex"]
exchange-gemini = ["ccxt/gemini"]

[dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
rust-embed = { version = "6.8.1", features = ["include-exclude"] }
anyhow = "1.0"
log = "0.4.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
self-replace = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
tokio-util = "0.7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
# `linux-native-sync-persistent` keeps the keyutils in-memory cache but backs it
# with Secret Service so credentials survive reboots. Plain `linux-native` is
# kernel-memory only and would make encrypted API credentials unrecoverable
# after a restart.
keyring = { version = "3", features = ["linux-native-sync-persistent", "apple-native", "windows-native", "crypto-rust"] }
dirs = "5"
rust-i18n = "3"
smallvec = "1"
itertools = "0.13"
tiny_http = "0.12"
webbrowser = "1.0"
url = "2"
urlencoding = "2.1"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
zeroize = "1"
uuid = { version = "1.26.1", features = ["v4"] }
rodio = { version = "0.19", default-features = false, features = ["wav"] }
# Venues are enabled through the app's `exchange-*` features above, so a
# minimal build does not compile every ccxt exchange implementation.
ccxt = { version = "4.5.90", default-features = false }

[patch.crates-io]
gpui = { path = "gpui-patched" }
gpui-component = { path = "gpui-component-patched" }

# CCXT is only used for authenticated REST calls; skip its debug symbols to keep
# incremental builds and the target directory smaller.
[profile.dev.package.ccxt]
debug = false

[profile.dev.package.ccxt-base]
debug = false

[profile.dev.package.ccxt-common]
debug = false

[build-dependencies]
winres = "0.1.12"
