name: Build

on:
  push:
    branches: [alpha, beta, release]
    tags: ['v*']
  pull_request:
    branches: [alpha, beta, release]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FINTER_BUILD_ID: ${{ github.sha }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            artifact: finter-darwin-arm64
            extension: ""
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: finter-darwin-x86
            extension: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: finter-windows
            extension: ".exe"
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: finter-linux
            extension: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev \
            libssl-dev pkg-config \
            desktop-file-utils zsync file

      - name: Configure update endpoint
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/alpha) url="https://data.coinwat.ch/alpha/version.json" ;;
            refs/heads/beta)  url="https://data.coinwat.ch/beta/version.json" ;;
            refs/tags/v*)     url="https://data.coinwat.ch/latest/version.json" ;;
            *)                url="" ;;
          esac
          echo "FINTER_VERSION_URL=$url" >> "$GITHUB_ENV"
          echo "Update endpoint: ${url:-<disabled>}"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify update endpoint embedded
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/finter${{ matrix.extension }}"
          if [ -n "$FINTER_VERSION_URL" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              # GUI-subsystem binaries do not reliably inherit stdout, so inspect the file.
              if ! LC_ALL=C grep -aqF -- "$FINTER_VERSION_URL" "$binary"; then
                echo "::error::FINTER_VERSION_URL was not embedded in $binary"
                exit 1
              fi
              actual="$FINTER_VERSION_URL"
            else
              actual=$(env -u FINTER_VERSION_URL "$binary" --print-update-url)
            fi
            if [ "$actual" != "$FINTER_VERSION_URL" ]; then
              echo "::error::Update endpoint mismatch: expected '$FINTER_VERSION_URL', got '$actual'"
              echo "Generated version_url.rs files:"
              find "target/${{ matrix.target }}/release/build" -name version_url.rs \
                -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; || true
              echo "URL strings found in binary:"
              strings "$binary" | grep -oE 'https://[^"[:space:]]+' | sort -u | head -20 || true
              ls -l "$binary"
              exit 1
            fi
            echo "Embedded update endpoint: $actual"
          else
            echo "Update checks disabled for this build"
          fi

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          APPDIR="$RUNNER_TEMP/FinTer.AppDir"
          OUT="target/$TARGET/release"
          APPIMAGE="$OUT/finter-$TARGET.AppImage"

          # appimagetool requires a very specific AppDir layout:
          #   <AppDir>/AppRun                     executable launcher (mandatory)
          #   <AppDir>/<name>.desktop             desktop file in the TOP LEVEL (mandatory)
          #   <AppDir>/<Icon=value>.png           top-level icon used to create .DirIcon (mandatory)
          #   <AppDir>/usr/bin/<binary>           the payload
          # A desktop file only in usr/share/applications is NOT found by appimagetool,
          # which is what produced "Desktop file not found, aborting".
          rm -rf "$APPDIR"
          mkdir -p \
            "$APPDIR/usr/bin" \
            "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/1024x1024/apps" \
            "$APPDIR/usr/share/pixmaps"

          install -m 0755 "$OUT/finter" "$APPDIR/usr/bin/finter"

          # Icon must be a PNG named after Icon= in the desktop file, in the top level.
          install -m 0644 assets/app-icon.png "$APPDIR/finter.png"
          install -m 0644 assets/app-icon.png "$APPDIR/usr/share/icons/hicolor/1024x1024/apps/finter.png"
          install -m 0644 assets/app-icon.png "$APPDIR/usr/share/pixmaps/finter.png"

          # Single source of truth: the desktop file shipped in assets/.
          install -m 0644 assets/finter.desktop "$APPDIR/finter.desktop"
          install -m 0644 assets/finter.desktop "$APPDIR/usr/share/applications/finter.desktop"

          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          set -e
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/finter" "$@"
          APPRUN
          chmod 0755 "$APPDIR/AppRun"

          # appimagetool refuses to package files that other users cannot read.
          chmod -R a+rX "$APPDIR"

          if command -v desktop-file-validate >/dev/null; then
            desktop-file-validate "$APPDIR/finter.desktop"
          fi

          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod 0755 "$RUNNER_TEMP/appimagetool.AppImage"

          rm -f "$APPIMAGE"
          ARCH=x86_64 "$RUNNER_TEMP/appimagetool.AppImage" \
            --appimage-extract-and-run --no-appstream \
            "$APPDIR" "$APPIMAGE"

          # Smoke test: unpack the result and make sure the AppImage really contains
          # the launcher, the desktop file and the binary.
          "$APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/finter
          test -f squashfs-root/finter.desktop
          test -f squashfs-root/.DirIcon
          rm -rf squashfs-root

          sha256sum "$APPIMAGE" | cut -d ' ' -f 1 > "$APPIMAGE.sha256"

      - name: Self-sign macOS binary
        if: runner.os == 'macOS'
        run: codesign -s - target/${{ matrix.target }}/release/finter

      - name: Generate SHA256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/finter${{ matrix.extension }}"
          $hash = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$binary.sha256", "$hash`n")
          Write-Host "SHA256: $hash"

      - name: Generate SHA256 checksum (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/finter${{ matrix.extension }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "$BINARY" | cut -d ' ' -f 1 > "$BINARY.sha256"
          else
            sha256sum "$BINARY" | cut -d ' ' -f 1 > "$BINARY.sha256"
          fi
          echo "SHA256: $(cat "$BINARY.sha256")"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/finter${{ matrix.extension }}
            target/${{ matrix.target }}/release/finter${{ matrix.extension }}.sha256
            target/${{ matrix.target }}/release/finter-${{ matrix.target }}.AppImage
            target/${{ matrix.target }}/release/finter-${{ matrix.target }}.AppImage.sha256

  release:
    name: Publish B2 updates
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/alpha' || github.ref == 'refs/heads/beta' || startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: b2-${{ github.ref }}
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Publish verified binaries then metadata
        run: python3 scripts/publish_updates.py

