name: Build

on:
  push:
    branches: [alpha, beta, release]
    tags: ['v*']
  pull_request:
    branches: [alpha, beta, release]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FINTER_BUILD_ID: ${{ github.sha }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: finter-darwin-arm64
            extension: ""
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: finter-darwin-x86
            extension: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: finter-windows
            extension: ".exe"
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: finter-linux
            extension: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libssl-dev pkg-config

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Self-sign macOS binary
        if: runner.os == 'macOS'
        run: codesign -s - target/${{ matrix.target }}/release/finter

      - name: Generate SHA256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/finter${{ matrix.extension }}"
          $hash = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$binary.sha256", "$hash`n")
          Write-Host "SHA256: $hash"

      - name: Generate SHA256 checksum (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/finter${{ matrix.extension }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "$BINARY" | cut -d ' ' -f 1 > "$BINARY.sha256"
          else
            sha256sum "$BINARY" | cut -d ' ' -f 1 > "$BINARY.sha256"
          fi
          echo "SHA256: $(cat "$BINARY.sha256")"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/finter${{ matrix.extension }}
            target/${{ matrix.target }}/release/finter${{ matrix.extension }}.sha256
