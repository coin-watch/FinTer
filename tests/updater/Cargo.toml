[package]
name = "updater-tests"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
sha2 = "0.10"
futures-util = "0.3"
self-replace = "1"
thiserror = "2"
dirs = "5"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
